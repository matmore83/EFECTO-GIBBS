[project]
name = "efecto-gibbs"
version = "0.1.0"
description = "Visualización del fenómeno de Gibbs mediante Series de Fourier"
readme = "README.md"
requires-python = ">=3.10.4"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pyqt6>=6.11.0",
    "pyqtgraph>=0.14.0",
    "scipy>=1.15.3",
    "soundfile>=0.13.1",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
