[project]
name = "efecto-gibbs"
version = "0.1.0"
description = "Visualización del fenómeno de Gibbs mediante Series de Fourier"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "numpy>=2.3.0",
    "scipy>=1.16.0",
    "matplotlib>=3.10.0",
name = "tp-final"
version = "0.1.0"
description = "Trabajo final"
requires-python = ">=3.10.4"

dependencies = [
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pyqt6>=6.11.0",
    "pyqtgraph>=0.14.0",
    "scipy>=1.15.3",
]

[tool.setuptools.packages.find]
where = ["."]
